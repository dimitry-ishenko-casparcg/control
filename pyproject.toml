[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "casparcg-control"
dynamic = ["version"]
description = "CasparCG Control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["dbus", "gi"]

[project.scripts]
casparcg-control = "casparcg_control.__main__:main"

[tool.setuptools]
packages = ["casparcg_control"]

[tool.setuptools.package-data]
casparcg_control = ["*.png"]

[tool.setuptools.dynamic]
version = {attr = "casparcg_control.__version__"}
